<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Vijo Shop</title>
<link rel="stylesheet" href="css/variables.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="bg"></div>
<div class="site">
<header>
<img class="logo" src="logo.png" alt="Logo">
<div class="search"><input placeholder="O que você está procurando?"><button>Buscar</button></div>
<div class="actions"><button>Categorias ▾</button><div class="cart">🛒<span>0</span></div></div>
</header>
<section class="hero">
<span class="badge">🔥 Em alta</span>
<h1>Mais vendidos</h1><p>Os produtos mais populares do momento</p>
<div class="cards">
<div class="card"><div class="container-imagem"><img src="produto1.png" alt="Produto 1"></div><h3>Produto 1</h3><div class="price">R$ 199,90</div><button>Ver oferta</button></div>
<div class="card"><div class="container-imagem"><img src="produto2.png" alt="Produto 2"></div><h3>Produto 2</h3><div class="price">R$ 199,90</div><button>Ver oferta</button></div>
<div class="card"><div class="container-imagem"><img src="produto3.png" alt="Produto 3"></div><h3>Produto 3</h3><div class="price">R$ 199,90</div><button>Ver oferta</button></div>
<div class="card"><div class="container-imagem"><img src="produto4.png" alt="Produto 4"></div><h3>Produto 4</h3><div class="price">R$ 199,90</div><button>Ver oferta</button></div>
</div><div class="more"><button>Ver mais produtos</button></div>
</section></div></body></html>
